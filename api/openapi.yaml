openapi: 3.0.3
info:
  title: homelab-proxy-manager API
  version: 0.1.0
  description: |
    JSON API of the Panel. All state-changing requests must send
    `Content-Type: application/json`. Authentication is a session cookie
    (`hpm_session`) set by `/auth/login` or `/setup`.
servers:
  - url: /api
paths:
  /status:
    get:
      operationId: getStatus
      summary: Public status, used by the UI to decide between setup and login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /setup:
    post:
      operationId: setup
      summary: Create the first admin; only allowed while no user exists
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      operationId: getMe
      security: [{ session: [] }]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hpm_session
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Status:
      type: object
      required: [setupRequired, version]
      properties:
        setupRequired: { type: boolean }
        version: { type: string }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 72 }
    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
